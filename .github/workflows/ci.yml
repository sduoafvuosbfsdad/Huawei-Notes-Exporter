name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Test (includes the issue #1 sample and thumbnail comparison)
        run: pytest -rs
      - name: Export the sample with the CLI
        run: |
          hinote-export tests/data/hinote-test-file.zip --output sample.pdf --json
          python -c "from pypdf import PdfReader; assert len(PdfReader('sample.pdf').pages) == 2"
      - uses: actions/upload-artifact@v4
        with:
          name: sample-pdf-py${{ matrix.python-version }}
          path: sample.pdf
