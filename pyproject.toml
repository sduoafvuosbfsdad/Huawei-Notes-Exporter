[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "huawei-notes-exporter"
version = "1.0.0"
description = "Export Huawei Notes .hinote archives to PDFs with native vector annotations"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Huawei Notes Exporter contributors" }]
keywords = ["huawei", "hinote", "notes", "pencilengine", "pdf"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Multimedia :: Graphics :: Editors :: Vector-Based",
]
dependencies = [
  "pypdf>=6,<7",
  "reportlab>=4,<6",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "ruff>=0.12,<1",
]

[project.scripts]
hinote-export = "huawei_notes_exporter.cli:main"

[project.urls]
Homepage = "https://github.com/sduoafvuosbfsdad/Huawei-Notes-Exporter"
Repository = "https://github.com/sduoafvuosbfsdad/Huawei-Notes-Exporter"
Issues = "https://github.com/sduoafvuosbfsdad/Huawei-Notes-Exporter/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
